test_results:

- name: say_goodbye
  pass_status: true
  expected_steps:
  - user: bye
    assertions:
    - bot_uttered:
        utter_name: utter_goodbye

- name: help_request
  pass_status: true
  expected_steps:
  - user: how do I use this
    assertions:
    - bot_uttered:
        utter_name: utter_help

- name: out_of_scope_request
  pass_status: true
  expected_steps:
  - user: I want to order a pizza
    assertions:
    - bot_uttered:
        utter_name: utter_out_of_scope

- name: transfer_charge_check
  pass_status: true
  expected_steps:
  - user: is there a transfer charge
    assertions:
    - action_executed: action_show_transfer_charge

- name: known_recipients_list
  pass_status: true
  expected_steps:
  - user: Show me my list of recipients
    assertions:
    - action_executed: action_show_recipients

- name: check_balance_and_transfer
  pass_status: true
  expected_steps:
  - user: How much money is on my account?
    assertions:
    - action_executed: action_show_balance
  - user: i want to transfer money
    assertions:
    - action_executed: transfer_money_form
    - slot_was_set:
      - name: requested_slot
        value: AA_CONTINUE_FORM

- name: pay_credit_card_then_check_balance
  pass_status: true
  expected_steps:
  - user: i want to pay off my emblem
    assertions:
    - action_executed: cc_payment_form
    - slot_was_set:
      - name: requested_slot
        value: AA_CONTINUE_FORM
  - user: How much money is on my account?
    assertions:
    - action_executed: action_show_balance

- name: greet_help_bye_flow
  pass_status: true
  expected_steps:
  - user: hi
    assertions:
    - bot_uttered:
        utter_name: utter_greet
    - bot_uttered:
        utter_name: utter_help
  - user: bye
    assertions:
    - bot_uttered:
        utter_name: utter_goodbye

- name: check_earnings_flow
  pass_status: true
